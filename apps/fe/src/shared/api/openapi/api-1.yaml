openapi: 3.0.0
paths:
  /api/auth/register:
    post:
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RegisterDto"
              example:
                email: coach.alex.petrov@example.com
                password: StrongPass123
                displayName: Alex Petrov
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AuthResponse"
                example:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.access-token
                  coach:
                    id: 3d7f7e9a-6e2e-4db7-9ee4-f66cc5967e42
                    email: coach.alex.petrov@example.com
                    displayName: Alex Petrov
      tags: &a1
        - Auth
  /api/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/LoginDto"
              example:
                email: coach.alex.petrov@example.com
                password: StrongPass123
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AuthResponse"
                example:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.access-token
                  coach:
                    id: 3d7f7e9a-6e2e-4db7-9ee4-f66cc5967e42
