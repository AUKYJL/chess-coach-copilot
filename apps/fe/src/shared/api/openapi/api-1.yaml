info:
  title: Chess Coach Copilot
  description: ""
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: coach.alex.petrov@example.com
        password:
          type: string
          example: StrongPass123
        displayName:
          type: string
          example: Alex Petrov
      required:
        - email
        - password
        - displayName
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: coach.alex.petrov@example.com
        password:
          type: string
          example: StrongPass123
      required:
        - email
        - password
    CoachProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
      required:
        - id
        - email
        - displayName
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        coach:
          $ref: "#/components/schemas/CoachProfileResponse"
      required:
        - accessToken
        - coach
    RefreshAccessTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
      required:
        - accessToken
    CreateStudentDto:
      type: object
      properties:
        displayName:
          type: string
          example: Maksim Sokolov
        birthYear:
          type: number
          example: 2012
        rating:
          type: number
          example: 1460
        notes:
          type: string
          example: Focuses on tactics and rook endgames.
      required:
        - displayName
    UpdateStudentDto:
      type: object
      properties:
        displayName:
          type: string
          example: Maksim Sokolov
        birthYear:
          type: number
          example: 2012
        rating:
          type: number
          example: 1460
        notes:
          type: string
          example: Focuses on tactics and rook endgames.
    SetStudentArchiveDto:
      type: object
      properties:
        archived:
          type: boolean
          example: true
      required:
        - archived
    StudentReadResponse:
      type: object
      properties:
        id:
          type: string
