                  displayName: Alex Petrov
      security:
        - bearer: []
      tags: *a1
  /api/students:
    get:
      operationId: StudentsController_list
      parameters:
        - name: search
          required: false
          in: query
          description: Case-insensitive search by student display name.
          schema:
            example: alex
            type: string
        - name: statuses
          required: false
          in: query
          schema:
            default:
              - active
              - archived
            type: array
            items:
              type: string
              enum:
                - active
                - archived
        - name: sort
          required: false
          in: query
          schema:
            type: string
            enum:
              - rating
              - completedAnalysisCount
              - lastAnalysisAt
        - name: order
          required: false
          in: query
          schema:
            default: desc
            type: string
            enum:
              - asc
              - desc
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StudentListResponse"
      security: &a2
        - bearer: []
      tags: &a3
        - Students
    post:
