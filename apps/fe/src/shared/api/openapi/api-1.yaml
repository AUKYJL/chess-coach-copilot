info:
  title: Chess Coach Copilot
  description: ""
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: coach.alex.petrov@example.com
        password:
          type: string
          example: StrongPass123
        displayName:
          type: string
          example: Alex Petrov
      required:
        - email
        - password
        - displayName
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: coach.alex.petrov@example.com
        password:
          type: string
          example: StrongPass123
      required:
        - email
        - password
    CoachProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
      required:
        - id
        - email
        - displayName
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        coach:
          $ref: "#/components/schemas/CoachProfileResponse"
      required:
        - accessToken
        - coach
    RefreshAccessTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
      required:
        - accessToken
    CreateStudentDto:
      type: object
      properties:
        displayName:
          type: string
          example: Maksim Sokolov
        birthYear:
          type: number
          example: 2012
        rating:
          type: number
          example: 1460
        notes:
          type: string
          example: Focuses on tactics and rook endgames.
      required:
        - displayName
    UpdateStudentDto:
      type: object
      properties:
        displayName:
          type: string
          example: Maksim Sokolov
        birthYear:
          type: number
          example: 2012
        rating:
          type: number
          example: 1460
        notes:
          type: string
          example: Focuses on tactics and rook endgames.
    SetStudentArchiveDto:
      type: object
      properties:
        archived:
          type: boolean
          example: true
      required:
        - archived
    CreateExternalAccountDto:
      type: object
      properties:
        platform:
          type: string
          enum:
            - LICHESS
            - CHESS_COM
          example: LICHESS
        username:
          type: string
          example: maksim_sokolov_2012
      required:
        - platform
        - username
    UpdateExternalAccountDto:
      type: object
      properties:
        platform:
          type: string
          enum:
            - LICHESS
            - CHESS_COM
          example: LICHESS
        username:
          type: string
          example: maksim_sokolov_2012
      required:
        - platform
        - username
    ImportPgnDto:
      type: object
      properties:
        studentColor:
          type: string
          enum:
            - WHITE
            - BLACK
          example: WHITE
        sourceLabel:
          type: string
          example: Lichess Study export
        rawPgn:
          type: string
          example: >-
            [Event "Training Game"]

            [Site "Lichess"]

            [Date "2026.07.25"]

            [Round "?"]

            [White "Student"]

            [Black "Opponent"]

            [Result "1-0"]


            1. e4 { [%eval 0.3] Good central control. } e5 { [%eval 0.1] } 2.
            Nf3 { [%eval 0.5] } Nc6 { [%eval 0.2] } 3. Bb5 { [%eval 0.9] } a6 {
            [%eval 0.4] } 1-0
      required:
        - studentColor
        - rawPgn
    ReportGenerationRequestDto:
      type: object
      properties:
        audience:
          type: string
          enum:
            - COACH
            - PARENT
          example: COACH
      required:
        - audience
    ReportUpdateDto:
      type: object
      properties:
        title:
          type: string
          example: "Coach report: Italian Game review"
        content:
          type: object
          example:
            summary: Middlegame planning improved, but tactical checks were rushed.
            highlights:
              - Better opening recall
              - Missed forcing continuation on move 18
            lessonFocus:
              - Candidate move discipline
            nextSteps:
              - Review forcing-move checklist
    HomeworkUpdateDto:
      type: object
      properties:
        title:
          type: string
          example: "Homework: candidate move discipline"
        content:
          type: object
          example:
            overview: Review the forcing-move checklist before every capture.
            exercises:
              - Annotate move 18 alternatives
              - Solve 5 fork puzzles
            focusPoints:
              - Checks, captures, threats
            notes:
              - Discuss move-order discipline in next lesson
